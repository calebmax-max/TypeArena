services:
  - type: web
    name: typearena-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gevent --worker-connections 1000 --workers 1 --timeout 120 --graceful-timeout 30 --keep-alive 5 wsgi:application
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: TYPEARENA_SOCKETIO_ASYNC_MODE
        value: gevent
      # Set this in the Render dashboard; never commit the secret itself.
      - key: TYPEARENA_TRAINING_ATTEMPT_SECRET
        sync: false

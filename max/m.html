<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎂</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Arial;
    background: linear-gradient(120deg,#ff9a9e,#fad0c4);
    text-align:center;
}

/* Birthday Text with bounce */
h1{
    position:absolute;
    top:35%;
    width:100%;
    font-size:70px;
    color:white;
    text-shadow:2px 2px 10px black;
    animation: bounce 2s infinite;
}

@keyframes bounce{
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

/* Falling images */
.fall{
    position:absolute;
    width:180px; /* Large images */
    animation:drop linear infinite, spin 4s linear infinite, swing 2s ease-in-out infinite, scaleAnim 2s ease-in-out infinite;
}

/* Falling animation */
@keyframes drop{
    0% { transform: translateY(-200px); opacity:1; }
    100% { transform: translateY(120vh); opacity:0.9; }
}

/* Spin animation */
@keyframes spin{
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

/* Swing side-to-side */
@keyframes swing{
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(50px); }
}

/* Grow/shrink */
@keyframes scaleAnim{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday 🎂</h1>

<!-- Birthday Song -->
<audio autoplay loop>
<source src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mid" type="audio/midi">
</audio>

<script>
const images = [
"https://i.imgur.com/6X4Q3KZ.png",
"https://i.imgur.com/VKQ9P7T.png",
"https://i.imgur.com/tL6V3Gv.png"
];

function createFallingImage(){
    const img = document.createElement("img");
    img.src = images[Math.floor(Math.random()*images.length)];
    img.classList.add("fall");

    // Random horizontal start
    img.style.left = Math.random()*100 + "vw";

    // Random animation speed
    const dropDuration = Math.random()*5+5;
    img.style.animationDuration = `${dropDuration}s, 4s, ${2+Math.random()*2}s, 2s`;

    document.body.appendChild(img);

    setTimeout(()=>{
        img.remove();
    },10000);
}

setInterval(createFallingImage, 400);
</script>

</body>
</html>

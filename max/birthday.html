<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BirthdayFlix</title>

<style>

body{
margin:0;
font-family:Arial;
background:#141414;
color:white;
}

/* PROFILE SCREEN */

#profiles{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
}

.profile-container{
display:flex;
gap:40px;
margin-top:30px;
}

.profile{
text-align:center;
cursor:pointer;
transition:0.3s;
}

.profile img{
width:120px;
border-radius:10px;
}

.profile:hover{
transform:scale(1.1);
}

/* MAIN PAGE */

#main{
display:none;
}

/* NAVBAR */

.navbar{
display:flex;
align-items:center;
padding:15px 40px;
background:#111;
}

.logo{
color:#e50914;
font-size:28px;
font-weight:bold;
}

/* HERO */

.hero{
height:70vh;
position:relative;
}

.hero video{
width:100%;
height:100%;
object-fit:cover;
}

.hero-content{
position:absolute;
bottom:60px;
left:60px;
}

.hero h1{
font-size:60px;
margin:0;
}

.hero button{
padding:12px 25px;
border:none;
background:#e50914;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

/* ROWS */

.row{
margin-left:40px;
margin-top:30px;
}

.row h2{
margin-bottom:10px;
}

.row-posters{
display:flex;
overflow-x:auto;
}

.row-posters::-webkit-scrollbar{
display:none;
}

/* CARDS */

.poster{
width:220px;
margin-right:12px;
border-radius:6px;
transition:0.3s;
cursor:pointer;
}

.poster:hover{
transform:scale(1.15);
}

/* POPUP */

#popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#222;
padding:40px;
border-radius:10px;
display:none;
text-align:center;
}

button.close{
padding:10px 20px;
background:#e50914;
border:none;
color:white;
cursor:pointer;
margin-top:20px;
}

</style>

</head>

<body>

<!-- PROFILE SELECTION -->

<div id="profiles">

<h1>Who's Celebrating?</h1>

<div class="profile-container">

<div class="profile" onclick="enterSite()">
<img src="https://i.pravatar.cc/150?img=1">
<p>Caleb</p>
</div>

<div class="profile" onclick="enterSite()">
<img src="https://i.pravatar.cc/150?img=5">
<p>Guest</p>
</div>

</div>

</div>

<!-- MAIN PAGE -->

<div id="main">

<div class="navbar">
<div class="logo">BirthdayFlix</div>
</div>

<!-- HERO -->

<div class="hero">

<video autoplay muted loop>
<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>

<div class="hero-content">
<h1>🎉 Caleb's Birthday Special</h1>
<button onclick="playMusic()">▶ Play Celebration</button>
</div>

</div>

<!-- ROW 1 -->

<div class="row">
<h2>🎂 Birthday Specials</h2>

<div class="row-posters">

<img src="https://picsum.photos/300/200?1" class="poster" onclick="celebrate()">
<img src="https://picsum.photos/300/200?2" class="poster" onclick="celebrate()">
<img src="https://picsum.photos/300/200?3" class="poster" onclick="celebrate()">
<img src="https://picsum.photos/300/200?4" class="poster" onclick="celebrate()">
<img src="https://picsum.photos/300/200?5" class="poster" onclick="celebrate()">

</div>

</div>

<!-- ROW 2 -->

<div class="row">
<h2>🎁 Gift Collection</h2>

<div class="row-posters">

<img src="https://picsum.photos/300/200?6" class="poster" onclick="celebrate()">
<img src="https://picsum.photos/300/200?7" class="poster" onclick="celebrate()">
<img src="https://picsum.photos/300/200?8" class="poster" onclick="celebrate()">
<img src="https://picsum.photos/300/200?9" class="poster" onclick="celebrate()">
<img src="https://picsum.photos/300/200?10" class="poster" onclick="celebrate()">

</div>

</div>

</div>

<!-- POPUP -->

<div id="popup">

<h2>🎉 HAPPY BIRTHDAY CALEB 🎉</h2>
<p>Wishing you success, happiness and lots of cake!</p>

<button class="close" onclick="closePopup()">Close</button>

</div>

<audio id="music">
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>

/* Enter site */

function enterSite(){

document.getElementById("profiles").style.display="none"
document.getElementById("main").style.display="block"

}

/* Play music */

function playMusic(){

document.getElementById("music").play()

}

/* Celebrate */

function celebrate(){

document.getElementById("popup").style.display="block"
confetti()

}

/* Close popup */

function closePopup(){

document.getElementById("popup").style.display="none"

}

/* Confetti */

function confetti(){

for(let i=0;i<100;i++){

let c=document.createElement("div")

c.innerHTML="🎉"

c.style.position="absolute"

c.style.left=Math.random()*window.innerWidth+"px"

c.style.top=Math.random()*window.innerHeight+"px"

c.style.fontSize="30px"

document.body.appendChild(c)

setTimeout(()=>c.remove(),2000)

}

}

</script>

</body>
</html>
